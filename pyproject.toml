[project]
name = "dtc-website"
version = "0.1.0"
description = "The unified DataTalks.Club website"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleach>=6.2,<7",
    "boto3>=1.43.33,<2",
    # Shared DataTalks.Club package (kernel); pinned release, see make core-link.
    "community-base @ git+https://github.com/DataTalksClub/community-base@v0.3.0",
    "cryptography>=50,<51",
    "django>=6.0,<6.1",
    "django-allauth>=65.10,<66",
    "django-loginas>=0.3.11,<1",
    "django-q2>=1.9,<2",
    "django-unfold>=0.62,<1",
    "dj-database-url>=3.0,<4",
    "gunicorn>=23,<24",
    "mistune>=3.1.3,<4",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "python-json-logger>=3.3,<5",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "axe-playwright-python==0.1.8",
    "django-stubs>=5.2,<6",
    "mypy>=1.17,<2",
    "pandas>=2.3,<4",
    "playwright>=1.58,<1.59",
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.12,<1",
    "tqdm>=4.67,<5",
]

[tool.uv]
package = false
exclude-newer = "2099-12-31T23:00:00Z"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    "*/migrations/*",
    "accounts/**",
    "api/**",
    "studio_courses/**",
    "course_management/**",
    "courses/**",
    "data/**",
    "e2e/**",
    "scripts/**",
]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"website/settings/*.py" = ["F403", "F405"]
"*/tests/*.py" = ["DJ008"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
    "accounts.*",
    "api.*",
    "studio_courses.*",
    "course_management.*",
    "courses.*",
    "data.*",
    "e2e.*",
]
ignore_errors = true

# The pinned community-base release ships no py.typed marker; treat its
# imports like any other untyped third-party package (D0.1a).  django-allauth
# and django-loginas are in the same situation (audit BE-16 opt-ins import
# them directly).
[[tool.mypy.overrides]]
module = ["community_base.*", "allauth.*", "loginas.*"]
ignore_missing_imports = true

# Audit BE-16: the per-app ``ignore_errors = true`` overrides above are the
# historical adopted-source baseline.  Modules opted back into the gates after
# that baseline -- newly authored or substantively changed files, listed in
# scripts/ci.py's ADOPTION_INTEGRATION_PYTHON -- are checked strictly: this later block
# wins for exactly these modules, so a new file can never ride a directory's
# historical exemption.  Keep it in sync with scripts/ci.py's opt-in list;
# ci/tests/test_adoption_gate_coverage.py enforces that.
[[tool.mypy.overrides]]
module = [
    "accounts.backends",
    "accounts.identity_resolution",
    "accounts.middleware",
    "accounts.studio_authorization",
    "accounts.auth",
    "accounts.views.impersonation",
    "accounts.tests.test_identity_quarantine_revocation",
    "accounts.tests.test_email_authentication_lookup",
    "accounts.tests.test_cmp_learner_import_run_binding",
    "api.utils",
    "api.crud",
    "api.tests.test_json_body_shapes",
    "courses.votes",
    "courses.services.learner_duplicate_preflight",
    "courses.management.commands.learner_duplicate_preflight",
    "courses.tests.test_enrollment_mutation_safety",
    "courses.tests.test_project_vote_budget",
    "courses.tests.test_learner_duplicate_preflight",
    "courses.tests.test_time_spent_parsing_conventions",
    "courses.tests.test_project_submission_error_containment",
    "courses.tests.test_project_eval_review_binding",
    "courses.tests.test_cmp_learner_history_run_binding",
    "scripts.tests.test_sync_course_repositories_cli",
    "scripts.tests.test_legacy_zoomcamp_username_allocation",
    "scripts.tests.test_scoring_import_atomicity",
    "scripts.tests.test_certificate_matching",
    "scripts.tests.test_reviewed_release_import",
    "scripts.ci",
    "scripts.content",
    "scripts.production_data",
    "scripts.seed_local_data",
    "scripts.tests.test_content",
    "scripts.tests.test_production_data",
    "scripts.tests.test_seed_local_data",
    "scripts.checkout_refresh",
    "scripts.tests.test_checkout_refresh",
    "scripts.verify_local_dataset",
    "scripts.tests.test_verify_local_dataset",
    "scripts.rebuild_gate",
    "scripts.tests.test_rebuild_gate",
    "course_management.mail_preferences",
    "course_management.package_mail",
    "courses.tests.test_package_mail_flows",
    "ci.tests.test_deploy_release_verification",
    "scripts.prod.reviewed_release",
    "scripts.prod.legacy_zoomcamp.identity",
    "accounts.tests.test_username_allocation",
]
ignore_errors = false

[tool.django-stubs]
django_settings_module = "website.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "website.settings.test"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--strict-markers -p no:cacheprovider -p test_support.root_pytest_guard"
markers = [
    "accessibility: deterministic WCAG A/AA route and state coverage",
    "core: bounded release-critical local Playwright coverage",
    "full: additional deterministic local Playwright coverage",
    "remote_readonly: explicit deployed read-only coverage",
    "remote_mutation: explicit isolated-development synthetic mutation",
    "live_email: explicit controlled-recipient live email smoke",
    "live_provider: explicit provider/webhook integration smoke",
    "smoke: core availability/auth smoke checks (run first, fail fast)",
    "provisioning: API course/content provisioning",
    "enrollment: enrollment and identity",
    "homework: homework submission + scoring + leaderboard flow",
    "project: project submission + peer review + scoring flow",
    "dashboards: dashboards and statistics pages",
    "teardown: cleanup and clean-state assertions",
    "email: Datamailer email verification via CMP's own send audit (dry-run render; xfails if Datamailer is not configured / dry-run is off on the deployment)",
]
