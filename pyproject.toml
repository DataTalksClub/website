[project]
name = "dtc-website"
version = "0.1.0"
description = "The unified DataTalks.Club website"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleach>=6.2,<7",
    "boto3>=1.43.33,<2",
# Shared DataTalks.Club package (kernel); pinned release, see
# `uv run python scripts/community_base_link.py link` for a local development link.
    # Pinned to the v0.5.4 release (D2.1a): carries C7.19's namespaced Studio
    # URLconf fix, C7.20's Studio shell extension points, C7.25's public
    # template seam and block contract check, and C7.26/C7.27's settings
    # shapes. v0.5.1 was never cut; v0.4.7 was the prior pin. D7.1 needs C7.4,
    # which is in this tag.
    "community-base @ git+https://github.com/DataTalksClub/community-base@v0.5.4",
    "cryptography>=50,<51",
    "django>=6.0,<6.1",
    "django-allauth>=65.10,<66",
    "django-loginas>=0.3.11,<1",
    "django-q2>=1.9,<2",
    "django-unfold>=0.62,<1",
    "dj-database-url>=3.0,<4",
    "gunicorn>=23,<24",
    "mistune>=3.1.3,<4",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.1,<2",
    "python-json-logger>=3.3,<5",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "axe-playwright-python==0.1.8",
    "django-stubs>=5.2,<6",
    "mypy>=1.17,<2",
    "pandas>=2.3,<4",
    "playwright>=1.58,<1.59",
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.12,<1",
    "tqdm>=4.67,<5",
]

[tool.uv]
package = false
exclude-newer = "2099-12-31T23:00:00Z"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    "*/migrations/*",
    "accounts/**",
    "api/**",
    "studio_courses/**",
    "course_management/**",
    "courses/**",
    "e2e/**",
    "scripts/**",
]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"website/settings/*.py" = ["F403", "F405"]
"*/tests/*.py" = ["DJ008"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
    "accounts.*",
    "api.*",
    "studio_courses.*",
    "course_management.*",
    "courses.*",
    "e2e.*",
]
ignore_errors = true

# The pinned community-base release ships no py.typed marker; treat its
# imports like any other untyped third-party package (D0.1a).  django-allauth
# and django-loginas are in the same situation (audit BE-16 opt-ins import
# them directly).
[[tool.mypy.overrides]]
module = [
    "community_base.*",
    "allauth.*",
    "loginas.*",
    # The Django mypy plugin resolves the "events" label to a module named
    # events.*; the label belongs to community_base.events since D4.1.
    "events.models",
]
ignore_missing_imports = true

# Audit BE-16: the per-app ``ignore_errors = true`` overrides above are the
# historical adopted-source baseline.  Modules opted back into the gates after
# that baseline -- newly authored or substantively changed files, listed in
# scripts/ci.py's ADOPTION_INTEGRATION_PYTHON -- are checked strictly: this later block
# wins for exactly these modules, so a new file can never ride a directory's
# historical exemption.  Keep it in sync with scripts/ci.py's opt-in list;
# ci/tests/test_adoption_gate_coverage.py enforces that.
[[tool.mypy.overrides]]
module = [
    "accounts.backends",
    "accounts.identity_resolution",
    "accounts.middleware",
    "accounts.studio_authorization",
    "accounts.auth",
    "accounts.views.impersonation",
    "accounts.tests.test_identity_quarantine_revocation",
    "accounts.tests.test_email_authentication_lookup",
    "accounts.tests.test_cmp_learner_import_run_binding",
    "api.utils",
    "api.crud",
    "api.tests.test_json_body_shapes",
    "courses.votes",
