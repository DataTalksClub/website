[project]
name = "dtc-website"
version = "0.1.0"
description = "The unified DataTalks.Club website"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<6.1",
    "django-q2>=1.9,<2",
    "dj-database-url>=3.0,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6",
    "mypy>=1.17,<2",
    "playwright>=1.54,<2",
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "pytest-playwright>=0.7,<1",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
exclude-newer = "2099-12-31T23:00:00Z"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"website/settings/*.py" = ["F403", "F405"]
"*/tests/*.py" = ["DJ008"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "website.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "website.settings.test"
python_files = ["test_*.py"]
markers = ["core: fast release-critical browser coverage"]
