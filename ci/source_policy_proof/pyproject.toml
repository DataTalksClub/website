[project]
name = "dtc-source-policy-proof"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "community-base @ git+https://github.com/DataTalksClub/community-base@v0.5.21",
    "pytest>=8.4,<10",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false
exclude-newer = "2099-12-31T23:00:00Z"

[tool.pytest.ini_options]
addopts = "--strict-markers -p no:cacheprovider"
python_files = ["contract.py"]
