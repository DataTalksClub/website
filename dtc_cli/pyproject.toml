[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtc-cli"
version = "0.1.0"
description = "Command-line client for the DataTalks.Club website management API"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
dtc = "dtc_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dtc_cli"]
