# Coolify supplies SOURCE_COMMIT and the same runtime .env to both services.
x-website: &website
  image: dtc-website:${SOURCE_COMMIT:?Set the immutable source revision}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  networks: [coolify]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *website
    command: [web-migrate]
    expose: ["8000"]
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -S
        - -c
        - "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5); assert r.status == 200"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  worker:
    <<: *website
    command: [worker]
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: website.settings.worker
    mem_limit: 240m
    cpus: "1.0"
    stop_grace_period: 30s
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -S
        - -m
        - core.worker_healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  coolify:
    external: true
