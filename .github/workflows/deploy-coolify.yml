name: Deploy Website Coolify (Contabo)

# Staging CD for Contabo Coolify: GHA builds linux/amd64 → GHCR → Coolify deploy API.
# No git SSH / deploy keys / git clone on Contabo for CD.
# Pattern copied from DataTalksClub/relay deploy-coolify.yml (pilot).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/workflows/deploy-prod.yml"
      - ".github/workflows/deploy-dev.yml"

concurrency:
  group: website-coolify
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datatalksclub/website

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: website.settings.test
      PUBLIC_MEDIA_STORE_BACKEND: memory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Lint and Django checks
        run: |
          uv run ruff check .
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py check

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.identity.outputs.version }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Construct release identity (exact ECR tag format)
        id: identity
        run: |
          set -euo pipefail
          # Same construction as website .github/workflows/deploy-dev.yml:
          #   version="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          # CMP/AISHL deploy-dev: DATE=$(date +'%Y%m%d-%H%M%S'); SHORT_SHA=…; TAG=${DATE}-${SHORT_SHA}
          # Live ECR example (CMP): 20261021-094333-f922dc4
          version="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Exact ECR production tag only (YYYYMMDD-HHMMSS-<7>). Never :latest. Never sha-<…>.
          tags: |
            type=raw,value=${{ steps.identity.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push (linux/amd64)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Website GHCR package stays PRIVATE (per brief: prefer private amd64).
      # Contabo pull requires a Coolify Registries ghcr.io entry with a
      # read:packages PAT (see agent report; gap documented until Alexey adds it).
      # Do NOT auto-publish the package: keep the org package private.

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    # Staging Contabo Coolify only — production AWS workflows stay separate.
    environment: coolify-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Require the full CI verdict for this source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
          uv run --frozen python -m deploy.ci_verdict require \
            --workflow ci.yml \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --timeout-seconds 1800 \
            --interval-seconds 30
      - name: Point staging at the pushed release
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        run: |
          set -euo pipefail
          # website-staging serves dev.datatalks.club through the routers
          # Coolify generates from its domains. Its runtime identity env must
          # track the pushed SHA first: /health/ready reports SOURCE_SHA, and
          # the served-SHA gate below compares exactly that. The staging app
          # uuid is a stable non-credential identifier (visible in container
          # and router names), so it is pinned here instead of a secret.
          STAGING_UUID="wodajblzizrjunwme3ossav3"
          jq -n \
            --arg version "$IMAGE_TAG" \
            --arg sha "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            '{data: [{key: "VERSION", value: $version}, {key: "SOURCE_SHA", value: $sha}, {key: "IMAGE_DIGEST", value: $digest}, {key: "DEPLOY_EXPECTED_DATABASE", value: "website_dev"}, {key: "DEPLOY_EXPECTED_ROLE", value: "website_dev"}]}' \
            > /tmp/staging-env.json
          curl --fail --show-error --silent --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data @/tmp/staging-env.json \
            "${COOLIFY_URL%/}/api/v1/applications/${STAGING_UUID}/envs/bulk"
          echo
          echo "Staging identity set to ${GITHUB_SHA} (${IMAGE_TAG})"
      - name: Trigger staging deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          STAGING_UUID="wodajblzizrjunwme3ossav3"
          response="$(curl --fail --show-error --silent --max-time 30 --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${STAGING_UUID}&force=true")"
          deployment_uuid="$(jq -er --arg uuid "$STAGING_UUID" '.deployments[] | select(.resource_uuid == $uuid) | .deployment_uuid' <<< "$response")"
          echo "Triggered staging deployment ${deployment_uuid}"
          # A same-SHA backend can still be serving while this deployment fails.
          # Require this exact deployment to finish before checking public health.
          for _ in $(seq 1 120); do
            status="$(curl --fail --show-error --silent --max-time 30 \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              "${COOLIFY_URL%/}/api/v1/deployments/${deployment_uuid}" | jq -er .status)"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled|cancelled-by-user) echo "Staging deployment ${deployment_uuid}: ${status}" >&2; exit 1 ;;
            esac
            sleep 5
          done
          echo "Staging deployment ${deployment_uuid} did not finish" >&2
          exit 1
      - name: Wait for dev to serve the pushed SHA
        run: |
          set -euo pipefail
          # dev.datatalks.club/health/ready is Cache-Control private,no-store,
          # so polling it observes the live backend. Anything but the pushed
          # SHA (stale release, non-200, timeout) fails the deploy.
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          for _ in $(seq 1 60); do
            # Capture the body first so a non-JSON answer (Traefik
            # "no available server", an error page) is reported with its
            # HTTP status and body head instead of a bare jq parse error.
            http_status="$(curl --show-error --silent --max-time 20 \
              -o "$body_file" -w '%{http_code}' \
              https://dev.datatalks.club/health/ready)" || http_status="curl-error"
            served=""
            if [[ "$http_status" == "200" ]]; then
              served="$(jq -er .source_sha < "$body_file" 2>/dev/null)" || served=""
            fi
            if [[ "$served" == "$GITHUB_SHA" ]]; then
              echo "dev serves ${GITHUB_SHA}"
              exit 0
            fi
            if [[ -z "$served" ]]; then
              echo "dev health not usable: HTTP ${http_status} body-head: $(head -c 200 "$body_file" | tr '\n' ' '); waiting for ${GITHUB_SHA}"
            else
              echo "dev serves ${served}; waiting for ${GITHUB_SHA}"
            fi
            sleep 15
          done
          echo "dev did not converge to ${GITHUB_SHA}" >&2
          exit 1
      - name: Probe the new confirm routes on dev
        run: |
          set -euo pipefail
          # A unique bad token defeats any edge caching: a 200 with the
          # invalid-link page proves the confirm routes serve the fixed code.
          # Missing routes answer 404; the FOR UPDATE bug answers 500.
          token="e2e-${GITHUB_SHA:0:12}-bad"
          body="$(curl --fail --show-error --silent --max-time 30 "https://dev.datatalks.club/courses/register/confirm/${token}/")"
          grep -qi "We could not find a registration for this confirmation link" <<< "$body"
          echo "dev confirm route responds with the invalid-link page"
