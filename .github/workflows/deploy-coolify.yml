name: Deploy Website Coolify (Contabo)

# Staging CD for Contabo Coolify: GHA builds linux/amd64 → GHCR → Coolify deploy API.
# No git SSH / deploy keys / git clone on Contabo for CD.
# Pattern copied from DataTalksClub/relay deploy-coolify.yml (pilot).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "deploy/coolify/**"
      - ".github/workflows/deploy-development.yml"
      - ".github/workflows/deploy-prod.yml"
      - ".github/workflows/deploy-dev.yml"

concurrency:
  group: website-coolify
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: datatalksclub/website

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DJANGO_SETTINGS_MODULE: website.settings.test
      PUBLIC_MEDIA_STORE_BACKEND: memory
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Lint and Django checks
        run: |
          uv run ruff check .
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py check

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.identity.outputs.version }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Construct release identity (exact ECR tag format)
        id: identity
        run: |
          set -euo pipefail
          # Same construction as website .github/workflows/deploy-dev.yml:
          #   version="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          # CMP/AISHL deploy-dev: DATE=$(date +'%Y%m%d-%H%M%S'); SHORT_SHA=…; TAG=${DATE}-${SHORT_SHA}
          # Live ECR example (CMP): 20261021-094333-f922dc4
          version="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Exact ECR production tag only (YYYYMMDD-HHMMSS-<7>). Never :latest. Never sha-<…>.
          tags: |
            type=raw,value=${{ steps.identity.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Website GHCR package stays PRIVATE (per brief: prefer private amd64).
      # Contabo pull requires a Coolify Registries ghcr.io entry with a
      # read:packages PAT (see agent report; gap documented until Alexey adds it).
      # Do NOT auto-publish the package: keep the org package private.

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    # Staging Contabo Coolify only — production AWS workflows stay separate.
    environment: coolify-staging
    steps:
      - name: Point staging at the pushed release
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        run: |
          set -euo pipefail
          # website-staging serves dev.datatalks.club through the routers
          # Coolify generates from its domains. Its runtime identity env must
          # track the pushed SHA first: /health/ready reports SOURCE_SHA, and
          # the served-SHA gate below compares exactly that. The staging app
          # uuid is a stable non-credential identifier (visible in container
          # and router names), so it is pinned here instead of a secret.
          STAGING_UUID="wodajblzizrjunwme3ossav3"
          jq -n \
            --arg version "$IMAGE_TAG" \
            --arg sha "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            '{data: [{key: "VERSION", value: $version}, {key: "SOURCE_SHA", value: $sha}, {key: "IMAGE_DIGEST", value: $digest}]}' \
            > /tmp/staging-env.json
          curl --fail --show-error --silent --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data @/tmp/staging-env.json \
            "${COOLIFY_URL%/}/api/v1/applications/${STAGING_UUID}/envs/bulk"
          echo
          echo "Staging identity set to ${GITHUB_SHA} (${IMAGE_TAG})"
      - name: Trigger staging deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          STAGING_UUID="wodajblzizrjunwme3ossav3"
          curl --fail --show-error --silent --request POST \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${STAGING_UUID}&force=true"
          echo
          echo "Triggered staging deploy for ${STAGING_UUID}"
      - name: Wait for dev to serve the pushed SHA
        run: |
          set -euo pipefail
          # dev.datatalks.club/health/ready is Cache-Control private,no-store,
          # so polling it observes the live backend. Anything but the pushed
          # SHA (stale release, non-200, timeout) fails the deploy.
          for _ in $(seq 1 60); do
            served="$(curl --show-error --silent --max-time 20 https://dev.datatalks.club/health/ready | jq -r .source_sha)" || true
            if [[ "$served" == "$GITHUB_SHA" ]]; then
              echo "dev serves ${GITHUB_SHA}"
              exit 0
            fi
            echo "dev serves ${served:-<unreachable>}; waiting for ${GITHUB_SHA}"
            sleep 15
          done
          echo "dev did not converge to ${GITHUB_SHA}" >&2
          exit 1
      - name: Probe the new confirm routes on dev
        run: |
          set -euo pipefail
          # A unique bad token defeats any edge caching: a 200 with the
          # invalid-link page proves the confirm routes serve the fixed code.
          # Missing routes answer 404; the FOR UPDATE bug answers 500.
          token="e2e-${GITHUB_SHA:0:12}-bad"
          body="$(curl --fail --show-error --silent --max-time 30 "https://dev.datatalks.club/courses/register/confirm/${token}/")"
          grep -qi "We could not find a registration for this confirmation link" <<< "$body"
          echo "dev confirm route responds with the invalid-link page"
      - name: Point prod at the pushed release
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_WEBSITE_SERVICE_UUID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          # prod.datatalks.club/health/ready reports SOURCE_SHA, and the prod gate
          # below compares exactly that — same contract as the staging pin above.
          # The prod app builds its own image from git (not GHCR compose), so only
          # the release identity is pinned here; IMAGE_DIGEST keeps Coolify's own
          # build identity until prod moves to GHCR compose. The bulk PATCH merges
          # keys, so DATABASE_URL and the other serving env are untouched.
          jq -n \
            --arg version "$IMAGE_TAG" \
            --arg sha "$GITHUB_SHA" \
            '{data: [{key: "VERSION", value: $version}, {key: "SOURCE_SHA", value: $sha}]}' \
            > /tmp/prod-env.json
          curl --fail --show-error --silent --request PATCH \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data @/tmp/prod-env.json \
            "${COOLIFY_URL%/}/api/v1/applications/${COOLIFY_SERVICE_UUID}/envs/bulk"
          echo
          echo "Prod identity set to ${GITHUB_SHA} (${IMAGE_TAG})"
      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_WEBSITE_SERVICE_UUID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_URL:-}" || -z "${COOLIFY_TOKEN:-}" || -z "${COOLIFY_SERVICE_UUID:-}" ]]; then
            echo "Missing Coolify secrets: COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_WEBSITE_SERVICE_UUID" >&2
            exit 1
          fi
          # Website Contabo app is still Coolify Dockerfile/git today (not a GHCR compose
          # service). GHCR receives exact ECR-format tags YYYYMMDD-HHMMSS-<7> (no :latest).
          # When website-staging is converted to Docker Image/compose like Relay, reuse
          # Relay's Pin Coolify compose step to set image to that ECR tag.
          curl --fail --show-error --silent --request POST             --header "Authorization: Bearer ${COOLIFY_TOKEN}"             --header "Accept: application/json"             "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_SERVICE_UUID}&force=true"
          echo
          echo "Triggered Coolify deploy for ${COOLIFY_SERVICE_UUID} (GHCR tag ${IMAGE_TAG} ready; app not yet on GHCR compose)"
      - name: Wait for prod to serve the pushed SHA
        run: |
          set -euo pipefail
          # Same gate as dev above, for the prod app: prod.datatalks.club/health/ready
          # is Cache-Control private,no-store, so polling it observes the live
          # backend. Anything but the pushed SHA (stale release, a container
          # that failed its db_preflight/migrate/sync/import startup gate,
          # non-200, timeout) fails the deploy.
          for _ in $(seq 1 60); do
            served="$(curl --show-error --silent --max-time 20 https://prod.datatalks.club/health/ready | jq -r .source_sha)" || true
            if [[ "$served" == "$GITHUB_SHA" ]]; then
              echo "prod serves ${GITHUB_SHA}"
              exit 0
            fi
            echo "prod serves ${served:-<unreachable>}; waiting for ${GITHUB_SHA}"
            sleep 15
          done
          echo "prod did not converge to ${GITHUB_SHA}" >&2
          exit 1
