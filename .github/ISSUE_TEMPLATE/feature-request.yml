name: Feature request
description: Suggest a DataTalks.Club website capability or improvement
labels: ["needs grooming", "enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: Describe who needs it, what they are trying to do, and why.
      placeholder: As a ..., I want to ... so that ...
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Details and examples
      description: Add workflows, edge cases, links, or screenshots that clarify the request.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Foundation / infrastructure
        - Authentication / accounts
        - Public content
        - Courses
        - Events
        - Email
        - Studio / admin API
        - Accessibility / SEO
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority estimate
      options:
        - Nice to have
        - Important
        - Critical or blocking
  - type: textarea
    id: done
    attributes:
      label: How would you verify it?
      description: List observable outcomes; the product manager will refine them during grooming.
