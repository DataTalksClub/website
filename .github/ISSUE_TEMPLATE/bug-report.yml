name: Bug report
description: Report broken behavior on the DataTalks.Club website
labels: ["needs grooming", "bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the page or operation and the behavior you observed.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Visit ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove credentials, cookies, tokens, and personal data before attaching evidence.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Foundation / infrastructure
        - Authentication / accounts
        - Public content
        - Courses
        - Events
        - Email
        - Studio / admin API
        - Accessibility / SEO
        - Other
    validations:
      required: true
