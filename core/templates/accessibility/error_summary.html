{% if form.errors %}
  <section
    class="a11y-error-summary"
    role="alert"
    aria-labelledby="error-summary-title"
    tabindex="-1"
    data-focus-error-summary
  >
    <h2 id="error-summary-title">Check the highlighted fields</h2>
    <ul>
      {% for field in form %}
        {% for error in field.errors %}
          <li>
            <a href="#{{ field.id_for_label }}">
              {{ field.label }}: {{ error }}
            </a>
          </li>
        {% endfor %}
      {% endfor %}
      {% for error in form.non_field_errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
