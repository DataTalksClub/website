{% include "core/_analytics_preferences.html" %}

{% include "core/_academy_cta.html" %}

{% include "core/_tour_cta.html" %}

<footer class="site-footer">
  <div class="shell site-footer-inner">
    <div class="site-footer-identity">
      <span class="site-footer-brand">
        <span class="site-footer-name">DataTalks.Club</span>
        <span class="site-footer-tagline">Free courses to learn data.</span>
      </span>
    </div>

    <nav class="site-footer-legal" aria-label="Legal">
      <a class="site-footer-legal-control app-link" href="/terms">
        Terms of Service
      </a>
      <a class="site-footer-legal-control app-link" href="/privacy">
        Privacy Policy
      </a>
      <button
        type="button"
        class="site-footer-legal-control site-footer-preferences app-link interactive-lift"
        data-analytics-preferences-open
        aria-haspopup="dialog"
        aria-controls="analytics-preferences-dialog"
      >
        Analytics preferences
      </button>
      <a class="site-footer-legal-control app-link" href="/impressum">
        Impressum
      </a>
    </nav>

    <div class="site-footer-runtime">
      <a
        href="https://github.com/DataTalksClub/website"
        target="_blank"
        rel="noopener noreferrer"
        class="site-footer-link site-footer-github app-link"
        title="Website source on GitHub (opens in a new tab)"
        aria-label="Website source on GitHub (opens in a new tab)"
      >
        <i class="fab fa-github" aria-hidden="true"></i>
      </a>
      <span class="footer-version app-muted">
        <span class="footer-version-label">Version</span>
        <span class="footer-version-value">{{ VERSION }}</span>
      </span>
    </div>
  </div>
</footer>
