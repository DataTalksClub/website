{% extends "base.html" %}
{% block title %}Welcome to DataTalks.Club{% endblock %}
{% block head_meta %}
  <meta
    name="description"
    content="{{ seo_description|default:'DataTalks.Club is the place to talk about data. Join free courses, weekly events, podcasts, and community learning.' }}"
  >
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DataTalks.Club">
  <meta
    property="og:title"
    content="{{ seo_title|default:'Welcome to DataTalks.Club' }}"
  >
  <meta
    property="og:description"
    content="{{ seo_description|default:'The global community of data science professionals, ML engineers, and AI practitioners.' }}"
  >
  <meta property="og:url" content="{{ canonical_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@DataTalksClub">
{% endblock %}
{% block breadcrumbs_nav %}{% endblock %}
