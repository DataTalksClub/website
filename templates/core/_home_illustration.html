{% comment %}
Hand-drawn style homepage doodles for design 5a.  Every variant shares one viewBox and
one palette so the four illustrations read as a set.  Decorative only: the surrounding
copy carries the meaning, so each one is aria-hidden.
{% endcomment %}

  role="presentation"
  aria-hidden="true"
  focusable="false"
  width="320"
  height="200"
