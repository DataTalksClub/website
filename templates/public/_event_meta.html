<div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm app-muted">
  <span class="inline-flex items-center gap-2">
    <i class="far fa-calendar-alt" aria-hidden="true"></i>
    <time class="inline-flex items-center gap-2" datetime="{{ event.starts_at }}">
      <span>{{ event.display_date }}</span>
      <i class="far fa-clock" aria-hidden="true"></i>
      <span>{{ event.display_clock }}</span>
    </time>
  </span>
  <span class="inline-flex items-center">
    <i class="{{ event.type_icon }}" aria-hidden="true"></i>
    <span class="sr-only">{{ event.type|title }}</span>
  </span>
</div>
