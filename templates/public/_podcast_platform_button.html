<a
  class="pill-button interactive-lift"
  data-podcast-platform="{{ link.provider }}"
  href="{{ link.url }}"
  target="_blank"
  rel="noopener noreferrer"
>
  {% if link.provider == "apple" %}
    <svg class="podcast-platform-icon" data-podcast-platform-icon="apple" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="8.7" r="2.25" fill="currentColor"></circle>
      <path d="M9.35 13.15a2.65 2.65 0 0 1 5.3 0c0 1.1-.45 2.05-1.2 2.7l-.72 5.15h-1.46l-.72-5.15a3.52 3.52 0 0 1-1.2-2.7Z" fill="currentColor"></path>
      <path d="M7.2 13.85a6.2 6.2 0 1 1 9.6 0M4.65 16.05a9.5 9.5 0 1 1 14.7 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"></path>
    </svg>
  {% elif link.provider == "spotify" or link.provider == "spotify_for_creators" %}
    <svg class="podcast-platform-icon" data-podcast-platform-icon="spotify" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="10" fill="currentColor"></circle>
      <path d="M6.8 9.15c3.9-1.05 8.3-.65 11.35 1.05M7.45 12.35c3.25-.8 6.95-.45 9.55 1M8.15 15.35c2.65-.55 5.55-.25 7.65.85" fill="none" stroke="var(--button-bg, white)" stroke-linecap="round" stroke-width="1.45"></path>
    </svg>
  {% elif link.provider == "youtube" %}
    <svg class="podcast-platform-icon" data-podcast-platform-icon="youtube" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M21.55 7.2a2.8 2.8 0 0 0-1.95-1.98C17.88 4.75 12 4.75 12 4.75s-5.88 0-7.6.47A2.8 2.8 0 0 0 2.45 7.2 29.1 29.1 0 0 0 2 12a29.1 29.1 0 0 0 .45 4.8 2.8 2.8 0 0 0 1.95 1.98c1.72.47 7.6.47 7.6.47s5.88 0 7.6-.47a2.8 2.8 0 0 0 1.95-1.98A29.1 29.1 0 0 0 22 12a29.1 29.1 0 0 0-.45-4.8Z" fill="currentColor"></path>
      <path d="m10 15.15 5.2-3.15L10 8.85v6.3Z" fill="var(--button-bg, white)"></path>
    </svg>
  {% else %}
    <span class="dot {{ link.dot }}" aria-hidden="true"></span>
  {% endif %}
  {{ link.label }}
  <span class="sr-only"> (opens in a new tab)</span>
</a>
