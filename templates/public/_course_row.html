<article
  class="grid cursor-pointer gap-4 rounded-md py-4 md:py-5"
  role="link"
  tabindex="0"
  onclick="if (!event.target.closest('a, button')) window.location.href='{{ record.public_path }}'"
  onkeydown="if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('a, button')) { event.preventDefault(); window.location.href='{{ record.public_path }}'; }"
  data-course-row
>
  <div>
    <span class="app-badge app-badge-upper app-badge-success">Active</span>
    <h3 class="mt-2 text-xl font-semibold md:text-2xl">
      <a class="app-link" href="{{ record.public_path }}">{{ record.title }}</a>
    </h3>
    <p class="mt-1 max-w-3xl text-sm leading-6 app-text md:text-base">
      {{ record.homework_count }} homework assignments · {{ record.project_count }} projects
    </p>
  </div>
</article>
