<article
  class="flex flex-col gap-4 py-5 sm:flex-row sm:items-center sm:justify-between"
  data-course-row
>
  <div class="min-w-0">
    <span class="app-badge app-badge-upper {{ badge_class }}">{{ badge_label }}</span>
    <h3 class="mt-3 text-xl font-semibold">
      <a class="app-link" href="{{ record.public_path }}">{{ record.title }}</a>
    </h3>
    <p class="mt-2 app-text">
      {{ record.homework_count }} homework assignments · {{ record.project_count }} projects
    </p>
  </div>
  <a
    class="shrink-0 self-start app-link sm:self-auto"
    href="{{ record.public_path }}"
    aria-label="View {{ record.title }}"
  >
    View course →
  </a>
</article>
