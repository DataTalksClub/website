<div class="event-timeline" data-event-view="{{ event_mode }}">
  {% for group in timeline_groups %}
    <section
      class="event-timeline-group"
      aria-labelledby="event-date-{{ group.key }}"
    >
      <div class="event-timeline-date-rail">
        <p id="event-date-{{ group.key }}" class="event-timeline-date app-heading">
          <time datetime="{{ group.key }}">
            {{ group.display_date }}
          </time>
          <span class="event-timeline-weekday app-muted">
            {{ group.weekday }}
          </span>
        </p>
      </div>
      <div class="event-timeline-content">
        <span class="event-timeline-marker" aria-hidden="true"></span>
        <div class="event-timeline-rows divide-y app-divide border-y app-border">
          {% for event in group.events %}
            {% include "public/_event.html" %}
          {% endfor %}
        </div>
      </div>
    </section>
  {% empty %}
    <p class="event-timeline-empty app-text">
      {% if is_past_events %}
        No past events.
      {% else %}
        No upcoming events.
      {% endif %}
    </p>
  {% endfor %}
</div>
