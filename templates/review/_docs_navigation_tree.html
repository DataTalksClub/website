<ul class="docs-tree-list">
  {% for item in docs_items %}
    <li class="docs-tree-item">
      <a
        class="docs-tree-link app-link
        {% if item.public_path == docs_current_path %}
          docs-tree-link-current
        {% endif %}
        "
        href="{{ item.public_path }}"
        {% if item.public_path == docs_current_path %}
          aria-current="page"
        {% endif %}
      >
        <span class="docs-tree-marker" aria-hidden="true"></span>
        <span>{{ item.title }}</span>
      </a>
      {% if item.children %}
        {% include "review/_docs_navigation_tree.html" with docs_items=item.children docs_current_path=docs_current_path only %}
      {% endif %}
    </li>
  {% endfor %}
</ul>
