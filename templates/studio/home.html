{% extends "base.html" %}
{% block title %}Studio · {{ brand_name }}{% endblock %}
{% block content %}
  <section class="panel">
    <p class="eyebrow">Staff workspace</p>
    <h1>Studio</h1>
    <p>Operational tools will appear here as their domain milestones are implemented.</p>
    <dl class="status-grid">
      <div><dt>Application</dt><dd>Ready</dd></div>
      <div><dt>Version</dt><dd>{{ app_version }}</dd></div>
    </dl>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary" type="submit">Sign out</button></form>
  </section>
{% endblock %}
