{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Moderate Q&amp;A · {{ event.title }}</title>
    <link rel="stylesheet" href="{% static 'events/qna/qna.css' %}">
  </head>
  <body class="qna-page qna-host-page">
    <main id="main-content" class="qna-shell" data-qna-mode="host">
      <p class="qna-kicker">Studio / co-host · {{ event.title }}</p>
      <h1>Moderate event Q&amp;A</h1>
      <p id="qna-banner" class="qna-banner" role="status">{{ session.state|capfirst }}</p>
      <div class="qna-host-actions">
        <a class="qna-button qna-button-secondary" href="{{ qna.present_url }}">Presentation view</a>
        <a class="qna-button qna-button-secondary" href="{{ qna.share_url }}">Participant view</a>
      </div>
      <section class="qna-card" aria-labelledby="moderation-heading">
        <div class="qna-section-head">
          <h2 id="moderation-heading">Moderation queue</h2>
          <span id="qna-counts" class="qna-muted"></span>
        </div>
        <ol id="qna-list" class="qna-list"></ol>
      </section>
    </main>
    {{ qna_config|json_script:"qna-config" }}
    <script src="{% static 'events/qna/qna.js' %}"></script>
    <script src="{% static 'events/qna/admin.js' %}"></script>
  </body>
</html>
