      /* Shared module-rail layout and rail rules, included by the module and
         unit pages inside their own <style> element. */

      /* The reading column is capped at the prose measure plus its 2.5rem
         working gutter rather than stretched to whatever the breakout leaves over. At the old
         `1fr` the article sat at its 38rem measure inside a ~53rem column, so
         the video and the "next lesson" button floated a long way past the
         edge of the prose they belonged to, and moving from a lesson to its
         homework page was a visible change of shape.  The pair is centred
         inside the breakout; the rail is chrome and is allowed to weigh less
         than the content beside it. */
      .module-layout {
        align-items: start;
        display: grid;
        gap: var(--space-7);
        grid-template-areas: "rail main";
        grid-template-columns: minmax(16rem, 19rem) minmax(0, calc(var(--measure) + 2.5rem));
        justify-content: center;
      }

      .module-main,
      .module-sidebar {
        min-width: 0;
      }

      /* The title band above a module layout spans the same width as the rail
         and reading column pair below it, so the breadcrumb and the title
         start on the rail's left edge instead of 72px inside it (owner audit
         2026-11-23).  The docs layout fits the ordinary column instead and
         carries no breakout, so it is not matched here. */
      .content-page-header:has(+ .content-page-content .module-layout.shell-breakout) > .content-shell {
        max-width: calc(19rem + 3rem + var(--measure) + 2.5rem + 2.5rem);
      }

      .module-sidebar {
        grid-area: rail;
        position: sticky;
        top: 1rem;
      }

      .module-main {
        grid-area: main;
      }

      /* No card, no border, no shadow: the rail is navigation at the same
         altitude as the breadcrumb trail, and the only framed things on a
         lesson page should be the lesson.  A twenty-lesson module is taller
         than a laptop viewport, so the sticky rail scrolls itself rather than
         pushing its own foot off the screen; its links are focusable, so the
         scroll region needs no tabindex of its own. */
      .module-rail {
        display: grid;
        gap: var(--space-3);
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
      }

      .rail-heading-row {
        align-items: center;
        display: flex;
        gap: var(--space-3);
        justify-content: space-between;
      }

      .rail-heading {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* --- hide/show ------------------------------------------------------
         The `.scroller-button` anatomy at rail density: the same circle, 2px
         ink outline and stroked glyph. It stays at 2.75rem so the quiet rail
         still provides the same 44px target as the reading-flow links, and the
         shared `:focus-visible` ring applies untouched.

         The control declares no transition of its own: the collapse itself is a
         `display` change, which cannot animate, and the one piece of motion a
         public control is allowed here is the shared `interactive-lift`
         primitive both halves carry in the markup. */
      .rail-toggle {
        align-items: center;
        background: var(--card);
        border: var(--border-strong);
        border-radius: var(--drawn-circle);
        color: var(--ink);
        cursor: pointer;
        display: none;
        flex: none;
        height: 2.75rem;
        justify-content: center;
        padding: 0;
        width: 2.75rem;
      }

      .rail-toggle:hover {
        background: var(--lavender);
      }

      .rail-toggle svg {
        fill: none;
        height: 1rem;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
        width: 1rem;
      }

      /* The restore stub takes the rail's own grid area and its own sticky
         offset, so the control a reader clicks to bring the rail back sits
         exactly where the rail's first row was.  Nothing is fixed to the
         viewport: the stub scrolls with the page until it pins, so it can never
         land on top of the masthead. */
      .rail-restore {
        grid-area: rail;
        position: sticky;
        top: 1rem;
      }

      /* `display: none`, not an offscreen or zero-width rail: a collapsed rail
         has to leave the accessibility tree and the tab order, otherwise a
         screen-reader or keyboard reader walks an invisible lesson list.  The
         attribute is written on <html> before first paint (see the lesson
         page's head script), so a reader who hid the rail never sees it appear
         and vanish on the next lesson. */
      :root[data-module-rail="collapsed"] .module-layout {
        grid-template-columns: 2.75rem minmax(0, calc(var(--measure) + 2.5rem));
        gap: var(--space-5);
      }

      :root[data-module-rail="collapsed"] .module-rail {
        display: none;
      }

      /* Both halves need scripting to do anything, and the collapse half needs
         it before it can be honest about what it controls, so neither is drawn
         until `core/content_page.html` has marked the document as scripted. */
      :root.js[data-module-rail="collapsed"] .rail-restore,
      :root.js:not([data-module-rail="collapsed"]) .rail-collapse {
        display: inline-flex;
      }

      /* The heading and the count share the rows' 0.5rem inset, so every line
         of the rail starts on the ordinals' edge rather than the heading
         hanging 8px left of the rows beneath it. */
      .rail-heading-row,
      .module-rail > .rail-heading,
      .rail-progress {
        padding-inline: var(--space-2);
      }

      .rail-progress {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.78rem;
      }

      /* Spacing separates the rows.  A rule between every pair of navigation
         items at this density is noise, the way the site navigation draws
         none. */
      .rail-units {
        display: grid;
        gap: 0.15rem;
      }

      /* The label is centred on its ordinal, so the current row's tint holds
         the title in its middle rather than at its top edge, and a row is as
         tall as the ordinal plus its padding (36px, above the 24px target
         minimum) rather than a fixed 44px that read as loose spacing. */
      .rail-unit-link {
        align-items: center;
        border-radius: var(--radius-control);
        color: var(--ink);
        display: grid;
        font-size: 0.9rem;
        font-weight: 700;
        gap: var(--space-2);
        grid-template-columns: 1.75rem minmax(0, 1fr);
        line-height: 1.35;
        min-height: 2.25rem;
        overflow-wrap: anywhere;
        padding: var(--space-1) var(--space-2);
        text-decoration: none;
      }

      .rail-unit-link:hover .rail-unit-title {
        color: var(--indigo);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      /* The current row's own 0.5rem inline padding is what makes the tint
         read as a rounded highlight, so it needs no accent bar and no negative
         margin pulling it out of alignment with the rows above and below. */
      .rail-unit.is-current .rail-unit-link {
        background: var(--lavender-deep);
      }

      /* --indigo on --lavender-deep measures 4.11:1 and fails AA, so the one
         tinted row answers the pointer with the underline alone and keeps its
         ink.  Nothing indigo may sit on this surface. */
      .rail-unit.is-current .rail-unit-link:hover .rail-unit-title {
        color: var(--ink);
      }

      .rail-unit-link .read-indicator {
        align-items: center;
        border: var(--border-soft);
        border-radius: var(--drawn-circle);
        color: var(--muted);
        display: inline-flex;
        flex: none;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        height: 1.75rem;
        justify-content: center;
        width: 1.75rem;
      }

      /* Three rotations of the drawn circle down the column, exactly as the
         pagination pills do it, so a stack of marks does not repeat one shape
         and stop reading as drawing. */
      .rail-units > li:nth-child(3n + 2) .read-indicator {
        border-radius: var(--drawn-circle-b);
      }

      .rail-units > li:nth-child(3n) .read-indicator {
        border-radius: var(--drawn-circle-c);
      }

      .rail-unit-link .read-indicator.is-read {
        background: var(--mint);
        border-color: var(--green-deep);
        color: var(--green-deep);
      }

      .rail-unit-link .read-indicator.is-current {
        background: var(--indigo);
        border-color: var(--indigo);
        color: var(--cream);
      }

      /* Homework is the module's last step, not an appendix under it, so it is
         a rail row with the same anatomy and the section rule the bands
         themselves use. */
      .rail-homework-step {
        border-top: var(--seam);
        margin-top: var(--space-1);
        padding-top: var(--space-3);
      }

      .rail-unit-link .rail-homework-mark {
        background: var(--bubble);
        border: var(--border-strong);
        border-radius: var(--drawn-circle);
        color: var(--on-bubble);
        font-size: 0.6rem;
      }

      /* A homework row's learner status sits under its title, aligned with
         the title rather than the mark, so the row's one target stays the
         link above it. */
      .rail-unit-status {
        margin: 0;
        padding-inline-start: calc(1.75rem + var(--space-2) + var(--space-2));
      }

      /* A row's own steps (`courses/_rail_substeps.html`): the homework's
         Introduction / Question N / Review & submit on its page, a project
         attempt's steps next.  Indented under the parent row's title, with a
         smaller mark that turns into the read lesson's mint check once done
         and the current row's tint for the step being shown. */
      .rail-substeps {
        display: grid;
        gap: 0.1rem;
        list-style: none;
        margin: var(--space-1) 0 0;
        padding: 0;
        padding-inline-start: calc(1.75rem + var(--space-2));
      }

      .rail-substep-link {
        align-items: center;
        border-radius: var(--radius-control);
        color: var(--body-text);
        display: grid;
        font-size: 0.85rem;
        gap: var(--space-2);
        grid-template-columns: 1.25rem minmax(0, 1fr);
        line-height: 1.3;
        min-height: 2rem;
        overflow-wrap: anywhere;
        padding: var(--space-1) var(--space-2);
        text-decoration: none;
      }

      .rail-substep-link:hover .rail-substep-title {
        color: var(--indigo);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .rail-substep-mark {
        align-items: center;
        border: var(--border-soft);
        border-radius: var(--drawn-circle);
        display: inline-flex;
        font-size: 0.7rem;
        font-weight: 800;
        height: 1.25rem;
        justify-content: center;
        width: 1.25rem;
      }

      .rail-substep:nth-child(3n + 2) .rail-substep-mark {
        border-radius: var(--drawn-circle-b);
      }

      .rail-substep:nth-child(3n) .rail-substep-mark {
        border-radius: var(--drawn-circle-c);
      }

      .rail-substep.is-done .rail-substep-mark {
        background: var(--mint);
        border-color: var(--green-deep);
        color: var(--green-deep);
      }

      .rail-substep.is-current .rail-substep-link {
        background: var(--lavender-deep);
        color: var(--ink);
        font-weight: 700;
      }

      .rail-substep.is-current .rail-substep-link:hover .rail-substep-title {
        color: var(--ink);
      }

      .rail-substep.is-current .rail-substep-mark {
        background: var(--indigo);
        border-color: var(--indigo);
        color: var(--cream);
      }

      .rail-signin {
        font-size: 0.85rem;
      }

      /* Keep the explanatory sign-in link on the same 44px target rhythm as
         the lesson and homework destinations above it. */
      .rail-signin .band-link {
        align-items: center;
        display: inline-flex;
        min-height: 2.75rem;
      }

      @media (max-width: 52rem) {
        .module-layout,
        :root[data-module-rail="collapsed"] .module-layout {
          gap: var(--space-6);
          grid-template-areas:
            "main"
            "rail";
          grid-template-columns: minmax(0, 1fr);
        }

        .module-sidebar {
          position: static;
        }

        /* Hiding is a desktop affordance only.  Here the lesson already runs
           the full width of the phone with the rail stacked underneath it, so
           collapsing reclaims no reading width -- it would only take away the
           one in-page route to the module's other lessons.  A reader who hid
           the rail on a laptop still gets it on their phone, and the stored
           preference is untouched, so the laptop keeps its state. */
        :root[data-module-rail="collapsed"] .module-rail {
          display: grid;
        }

        :root.js[data-module-rail="collapsed"] .rail-restore,
        :root.js:not([data-module-rail="collapsed"]) .rail-collapse {
          display: none;
        }

        /* The list runs in full and the page carries one scroll.  With the
           card frame gone the rail needs a boundary of its own here, drawn in
           the same dashed grammar the bands use. */
        .module-rail {
          border-top: var(--seam);
          max-height: none;
          overflow-y: visible;
          padding-top: var(--space-5);
        }
      }

      /* --- the course rail ---------------------------------------------
         `courses/_shared_module_rail.html`: every module of the course, the
         current one open into its lessons, homework and attempts.  Module
         rows use the lesson rows' anatomy one step larger, so the two levels
         read as one list at two depths. */
      .course-rail-summary {
        display: none;
      }

      .course-rail-body {
        display: grid;
        gap: var(--space-3);
      }

      .course-rail-head {
        display: grid;
        gap: var(--space-1);
        padding-inline: var(--space-2);
      }

      .course-rail-title {
        font-size: 1rem;
        line-height: 1.3;
      }

      .course-rail-title a {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .course-rail-title a:hover {
        color: var(--indigo);
      }

      .course-rail-modules {
        display: grid;
        gap: var(--space-1);
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .course-rail-module-link {
        align-items: center;
        border-radius: var(--radius-control);
        color: var(--ink);
        display: grid;
        font-size: 0.95rem;
        font-weight: 700;
        gap: var(--space-2);
        grid-template-columns: 1.75rem minmax(0, 1fr) auto;
        line-height: 1.3;
        min-height: 2.25rem;
        overflow-wrap: anywhere;
        padding: var(--space-1) var(--space-2);
        text-decoration: none;
      }

      .course-rail-module-link:hover .course-rail-module-title {
        color: var(--indigo);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .course-rail-module.is-open > .course-rail-module-link {
        background: var(--lavender-deep);
      }

      .course-rail-module.is-open > .course-rail-module-link:hover .course-rail-module-title {
        color: var(--ink);
      }

      .course-rail-module-link .read-indicator {
        align-items: center;
        border: var(--border-soft);
        border-radius: var(--drawn-circle);
        color: var(--muted);
        display: inline-flex;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        height: 1.75rem;
        justify-content: center;
        width: 1.75rem;
      }

      .course-rail-module:nth-child(3n + 2) > .course-rail-module-link .read-indicator {
        border-radius: var(--drawn-circle-b);
      }

      .course-rail-module:nth-child(3n) > .course-rail-module-link .read-indicator {
        border-radius: var(--drawn-circle-c);
      }

      .course-rail-module.is-open > .course-rail-module-link .read-indicator {
        background: var(--indigo);
        border-color: var(--indigo);
        color: var(--cream);
      }

      .course-rail-module-link .read-indicator.is-read {
        background: var(--mint);
        border-color: var(--green-deep);
        color: var(--green-deep);
      }

      .course-rail-count {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
      }

      /* The open module's own rows sit one step in, under its title. */
      .course-rail-module > .rail-units {
        margin: var(--space-1) 0 var(--space-2);
        padding-inline-start: var(--space-4);
      }

      .rail-unit-status {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1) var(--space-2);
      }

      .rail-unit-due {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
      }

      /* Attempts no module carries close the course list, under one seam. */
      .course-rail-modules > .rail-attempt-step {
        margin-top: 0;
      }

      .course-rail-modules > .rail-attempt-step + .rail-attempt-step {
        border-top: 0;
        padding-top: 0;
      }

      /* A long module's lesson list shows a window around the reader's place;
         the rest wait behind "Show all N lessons".  Without scripting the
         button cannot work, so every lesson is shown and the button is not. */
      .rail-more-row {
        display: none;
      }

      :root.js .rail-more-row {
        display: block;
      }

      :root.js .rail-units.is-capped:not(.is-expanded) > .rail-unit-extra {
        display: none;
      }

      .rail-more {
        background: none;
        border: 0;
        border-radius: var(--radius-control);
        color: var(--indigo);
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 700;
        min-height: 2.25rem;
        padding: var(--space-1) var(--space-2);
        padding-inline-start: calc(1.75rem + var(--space-2) + var(--space-2));
        text-align: start;
        text-decoration: underline;
        text-underline-offset: 0.2em;
        width: 100%;
      }

      .rail-more:hover {
        color: var(--ink);
      }

      @media (max-width: 52rem) {
        /* On a phone and a tablet the course rail opens the content as a
           "Course contents" fold, collapsed, naming the current module; the
           page goes on underneath it. */
        .module-layout:has(.course-rail),
        :root[data-module-rail="collapsed"] .module-layout:has(.course-rail) {
          gap: var(--space-5);
          grid-template-areas:
            "rail"
            "main";
        }

        .module-rail.course-rail {
          border-top: 0;
          padding-top: 0;
        }

        .course-rail-fold {
          background: var(--card);
          border: var(--border-soft);
          border-radius: var(--radius-card);
        }

        .course-rail-summary {
          align-items: center;
          border-radius: var(--radius-card);
          cursor: pointer;
          display: flex;
          gap: var(--space-3);
          justify-content: space-between;
          list-style: none;
          min-height: 2.75rem;
          padding: var(--space-3) var(--space-4);
        }

        .course-rail-summary::-webkit-details-marker {
          display: none;
        }

        .course-rail-summary-text {
          display: grid;
          gap: 0.1rem;
          min-width: 0;
        }

        .course-rail-summary-label {
          color: var(--ink);
          font-weight: 800;
        }

        .course-rail-summary-current {
          color: var(--muted);
          font-size: 0.9rem;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .course-rail-summary-chevron {
          fill: none;
          flex: none;
          height: 1rem;
          stroke: var(--ink);
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-width: 2;
          width: 1rem;
        }

        .course-rail-fold[open] .course-rail-summary-chevron {
          transform: rotate(180deg);
        }

        .course-rail-fold[open] .course-rail-summary {
          border-bottom: var(--rule);
          border-radius: var(--radius-card) var(--radius-card) 0 0;
        }

        .course-rail-body {
          padding: var(--space-4) var(--space-3);
        }
      }
