      /* Shared module-rail layout and rail rules, included by the module and
         unit pages inside their own <style> element. */

      /* The reading column is capped at the system's own content width rather
         than stretched to whatever the breakout leaves over.  At the old
         `1fr` the article sat at its 38rem measure inside a ~53rem column, so
         the video and the "next lesson" button floated a long way past the
         edge of the prose they belonged to, and moving from a lesson to its
         homework page was a visible change of shape.  The pair is centred
         inside the breakout; the rail is chrome and is allowed to weigh less
         than the content beside it. */
      .module-layout {
        align-items: start;
        display: grid;
        gap: 3rem;
        grid-template-areas: "rail main";
        grid-template-columns: minmax(16rem, 19rem) minmax(0, var(--content-width));
        justify-content: center;
      }

      .module-main,
      .module-sidebar {
        min-width: 0;
      }

      .module-sidebar {
        grid-area: rail;
        position: sticky;
        top: 1rem;
      }

      .module-main {
        grid-area: main;
      }

      /* No card, no border, no shadow: the rail is navigation at the same
         altitude as the breadcrumb trail, and the only framed things on a
         lesson page should be the lesson.  A twenty-lesson module is taller
         than a laptop viewport, so the sticky rail scrolls itself rather than
         pushing its own foot off the screen; its links are focusable, so the
         scroll region needs no tabindex of its own. */
      .module-rail {
        display: grid;
        gap: 0.75rem;
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
      }

      .rail-heading-row {
        align-items: center;
        display: flex;
        gap: 0.75rem;
        justify-content: space-between;
      }

      .rail-heading {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* --- hide/show ------------------------------------------------------
         The `.scroller-button` anatomy at rail density: the same circle, 2px
         ink outline and stroked glyph, taken down from 2.75rem to 2.25rem
         because it sits inside quiet navigation rather than under a carousel.
         36px clears the 24px WCAG 2.2 target floor with room to spare, and the
         shared `:focus-visible` ring applies untouched.

         The control declares no transition of its own: the collapse itself is a
         `display` change, which cannot animate, and the one piece of motion a
         public control is allowed here is the shared `interactive-lift`
         primitive both halves carry in the markup. */
      .rail-toggle {
        align-items: center;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: var(--drawn-circle);
        color: var(--ink);
        cursor: pointer;
        display: none;
        flex: none;
        height: 2.25rem;
        justify-content: center;
        padding: 0;
        width: 2.25rem;
      }

      .rail-toggle:hover {
        background: var(--lavender);
      }

      .rail-toggle svg {
        fill: none;
        height: 1rem;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
        width: 1rem;
      }

      /* The restore stub takes the rail's own grid area and its own sticky
         offset, so the control a reader clicks to bring the rail back sits
         exactly where the rail's first row was.  Nothing is fixed to the
         viewport: the stub scrolls with the page until it pins, so it can never
         land on top of the masthead. */
      .rail-restore {
        grid-area: rail;
        position: sticky;
        top: 1rem;
      }

      /* `display: none`, not an offscreen or zero-width rail: a collapsed rail
         has to leave the accessibility tree and the tab order, otherwise a
         screen-reader or keyboard reader walks an invisible lesson list.  The
         attribute is written on <html> before first paint (see the lesson
         page's head script), so a reader who hid the rail never sees it appear
         and vanish on the next lesson. */
      :root[data-module-rail="collapsed"] .module-layout {
        grid-template-columns: 2.25rem minmax(0, var(--content-width));
        gap: 1.5rem;
      }

      :root[data-module-rail="collapsed"] .module-rail {
        display: none;
      }

      /* Both halves need scripting to do anything, and the collapse half needs
         it before it can be honest about what it controls, so neither is drawn
         until `core/content_page.html` has marked the document as scripted. */
      :root.js[data-module-rail="collapsed"] .rail-restore,
      :root.js:not([data-module-rail="collapsed"]) .rail-collapse {
        display: inline-flex;
      }

      .rail-progress {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 0.78rem;
      }

      /* Spacing separates the rows.  A rule between every pair of navigation
         items at this density is noise, the way the site navigation draws
         none. */
      .rail-units {
        display: grid;
        gap: 0.15rem;
      }

      .rail-unit-link {
        align-items: start;
        border-radius: 0.6rem;
        color: var(--ink);
        display: grid;
        font-size: 0.9rem;
        font-weight: 700;
        gap: 0.6rem;
        grid-template-columns: 1.75rem minmax(0, 1fr);
        line-height: 1.4;
        min-height: 2.25rem;
        overflow-wrap: anywhere;
        padding: 0.3rem 0.5rem;
        text-decoration: none;
      }

      .rail-unit-link:hover .rail-unit-title {
        color: var(--indigo);
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      /* The current row's own 0.5rem inline padding is what makes the tint
         read as a rounded highlight, so it needs no accent bar and no negative
         margin pulling it out of alignment with the rows above and below. */
      .rail-unit.is-current .rail-unit-link {
        background: var(--lavender-deep);
      }

      /* --indigo on --lavender-deep measures 4.11:1 and fails AA, so the one
         tinted row answers the pointer with the underline alone and keeps its
         ink.  Nothing indigo may sit on this surface. */
      .rail-unit.is-current .rail-unit-link:hover .rail-unit-title {
        color: var(--ink);
      }

      .rail-unit-link .read-indicator {
        align-items: center;
        border: 1.5px solid var(--line-soft);
        border-radius: var(--drawn-circle);
        color: var(--muted);
        display: inline-flex;
        flex: none;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        height: 1.75rem;
        justify-content: center;
        width: 1.75rem;
      }

      /* Three rotations of the drawn circle down the column, exactly as the
         pagination pills do it, so a stack of marks does not repeat one shape
         and stop reading as drawing. */
      .rail-units > li:nth-child(3n + 2) .read-indicator {
        border-radius: var(--drawn-circle-b);
      }

      .rail-units > li:nth-child(3n) .read-indicator {
        border-radius: var(--drawn-circle-c);
      }

      .rail-unit-link .read-indicator.is-read {
        background: var(--mint);
        border-color: var(--green-deep);
        color: var(--green-deep);
      }

      .rail-unit-link .read-indicator.is-current {
        background: var(--indigo);
        border-color: var(--indigo);
        color: var(--cream);
      }

      /* Homework is the module's last step, not an appendix under it, so it is
         a rail row with the same anatomy and the section rule the bands
         themselves use. */
      .rail-homework {
        border-top: 2px dashed var(--line-soft);
        margin-top: 0.25rem;
        padding-top: 0.85rem;
      }

      .rail-unit-link .rail-homework-mark {
        background: var(--bubble);
        border: 2px solid var(--line);
        border-radius: var(--drawn-circle);
        color: var(--on-bubble);
        font-size: 0.6rem;
      }

      .rail-signin {
        font-size: 0.85rem;
      }

      /* 32px clears the 24px WCAG 2.2 target floor for an inline link, the
         same allowance a breadcrumb crumb takes. */
      .rail-signin .band-link {
        align-items: center;
        display: inline-flex;
        min-height: 2rem;
      }

      @media (max-width: 52rem) {
        .module-layout,
        :root[data-module-rail="collapsed"] .module-layout {
          gap: 2rem;
          grid-template-areas:
            "main"
            "rail";
          grid-template-columns: minmax(0, 1fr);
        }

        .module-sidebar {
          position: static;
        }

        /* Hiding is a desktop affordance only.  Here the lesson already runs
           the full width of the phone with the rail stacked underneath it, so
           collapsing reclaims no reading width -- it would only take away the
           one in-page route to the module's other lessons.  A reader who hid
           the rail on a laptop still gets it on their phone, and the stored
           preference is untouched, so the laptop keeps its state. */
        :root[data-module-rail="collapsed"] .module-rail {
          display: grid;
        }

        :root.js[data-module-rail="collapsed"] .rail-restore,
        :root.js:not([data-module-rail="collapsed"]) .rail-collapse {
          display: none;
        }

        /* The list runs in full and the page carries one scroll.  With the
           card frame gone the rail needs a boundary of its own here, drawn in
           the same dashed grammar the bands use. */
        .module-rail {
          border-top: 2px dashed var(--line-soft);
          max-height: none;
          overflow-y: visible;
          padding-top: 1.5rem;
        }
      }
